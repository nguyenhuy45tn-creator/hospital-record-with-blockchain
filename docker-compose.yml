version: '3.8'
services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sampledb
    ports:
      - '5432:5432'
    volumes: 
      - db:/var/lib/postgresql/data
  app:
    image: poseidorn/presentation:latest
    restart: always
    depends_on:
      - db
    ports:
      - "5001:5001" # For Flask app
      - "8545:8545" # For Ganache
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sampledb
     
volumes:
  db:
    driver: local