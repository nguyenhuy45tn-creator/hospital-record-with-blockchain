        <script>
            function download_pdf(el_id){
                var element = document.getElementById(el_id);
                var opt = {
                            margin:       1,
                            filename:     'myfile.pdf',
                            image:        { type: 'png'},
                            html2canvas:  { scale: 2 },
                            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                            };
                html2pdf().set(opt).from(element).save();
            }
        </script>
