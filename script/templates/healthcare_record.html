<!DOCTYPE html>
<html>
<head>
    <title>My Health Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        pre {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">🩺 My Health Records</h2>
        {% for record in records %}
            <div class="card mb-4">
                <div class="card-header text-white" style="background: linear-gradient(90deg, #ff7e5f, #feb47b);">

                    Record ID: {{ record.record_id }}
                </div>
                <div class="card-body">
                    <p><strong>Patient ID:</strong> {{ record.patient_user_id }}</p>
                    <p><strong>Last Updated:</strong> {{ record.last_updated_at }}</p>
                    <p><strong>Updated By:</strong> {{ record.last_updated_by_user_id }}</p>
                    <p><strong>Record Data:</strong></p>
                    <pre>{{ record.record_data | tojson(indent=2) }}</pre>
                </div>
            </div>
        {% endfor %}
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">Logout</a>
    </div>
</body>
</html>
