{% extends 'admin_base.html' %}

{% block User %}

<div class="container" style="width: 110%;" id="users">
    <div class="row-sm-2">
        <div class="col-sm-6">
            <h2> 
                User administration
            </h2>
        </div>
        <div class="col-sm-3">
            <button
                hx-get="/admin/add_user"
                hx-target="#modals-here"
                hx-trigger="click"
                data-bs-toggle="modal"
                data-bs-target="#modals-here"
                class="btn primary">
                Add user
            </button>

            <div id="modals-here"
                class="modal modal-blur fade"
                style="display: none"
                aria-hidden="false"
                tabindex="-1">
                <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
                    <div class="modal-content">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row-sm" hx-get="admin/user_table" hx-trigger="load">
        <span class="loader"></span>
    </div>


</div>
{% endblock %}
