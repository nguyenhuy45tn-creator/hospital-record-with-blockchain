<form 
id="change-password-form"
hx-post="/change_password/{{sys_wide_id}}"
hx-target="this"
hx-swap="outerHTML">
    <label for="new-password" class="form-label">New password</label>
    <input 
        id="new-password"
        type="password" 
        name="new_password"
        class="form-control"
        value="new password">
    <div id="emailHelp" class="form-text">We'll never share your password with anyone else.</div>
    <button> 
        Submit
    </button>
</form>
