<form hx-post="/edit_user_information/basic/{{sys_wide_id}}" hx-target="#patient-info" hx-swap="outerHTML">
    <div class="mb-3 card" style="width: 70%" id="User-Basic-Info">
        <!--subsection title -->
        <div class="card-header">
            <div class="mb-3 row align-items-center ">
                <div class="col-sm-1 justify-content-end">
                    <img src="{{ url_for('static', filename='greeting-man_76769.png') }}" 
                    alt="Italian Trulli"  
                    width="100%">
                </div>
                <div class="col-sm-6 align-middle">
                    <h3 class="mb-0">Personal information</h3>
                </div>
            </div>

        </div>
        <div class="card-body" id="Basic-Information" style="width: 100%;">
                <div class="mb-3 row">
                    <label for="full-name" class="col-sm-2">Full name:</label>
                    <div class="col-sm-6 editable-basic-info" id="full-name">
                        <input type="text" value="{{full_name}}" name="full_name">
                    </div>

                </div>

                <div class="mb-3 row">
                    <!-- <div class="col-sm-2" >
                        Address:
                    </div> -->
                    <label for="address" class="col-sm-2">Address:</label>
                    <div class="col-sm-8 editable-basic-info" id="address">
                        <input type="text" value="{{address}}" name="address">
                    </div>
                </div>
        </div>
        <div class=" card-footer">
            <div class="row justify-content-end">
                <div class="col-sm-2" >
                    <button class="btn btn-outline-dark"> 
                            <label for="edit-basic-icon"><strong><u>Submit</u></strong></label>
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
