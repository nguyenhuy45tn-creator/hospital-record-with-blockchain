{% extends 'base.html' %}

{% block IndividualInfo %}



<div class="container"> 
    <div id="user-basic-info">
        {% for column in df.columns%}
            {% if column in ["full_name","address"] %}
            <div class="mb-3 row">
                <div class="col-sm-2" >
                {{ column }}:
                </div>
                <div class="col-sm-8" >
                    {{ df[column].values[0] }}
                </div>
            </div>
            {% elif column in ["updated_by_user_id"]%}
                
            {% else %}
            <div class="mb-3 row">
                <div class="col-sm-2" >
                {{ column }}:
                </div>
                <div class="col-sm-8" >
                    {{ df[column].values[0] }}
                </div>
            </div>
            {% endif %}
        {% endfor %}
    </div>
            <button 
                hx-get="/edit_user_information/{{user_id}}" 
                hx-target="#user-basic-info"
                hx-swap="outerHTML"> 
                    Edit
            </button>
</div>






{%endblock%}
