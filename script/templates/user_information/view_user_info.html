{% extends 'base.html' %}

{% block IndividualInfo %}

<ul>
    {% for column in df.columns%}
        
        <li >
            <b>{{ column }}:</b>
            <br>
            <div class="user_info user_info_inner" id="{{column}}">
                {{ df[column].values[0] }}
            </div>
            <br>
            <br>
            <button 
            hx-get="/edit_user_information" 
            hx-target="#{{column}}"> Edit</button>
        </li>
        

</ul>

{% endfor %}


{%endblock%}
